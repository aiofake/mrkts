site_name: mrkts
site_description: Asynchronous Python client for the MRKT API
site_url: https://aiofake.github.io/mrkts/
repo_url: https://github.com/aiofake/mrkts
repo_name: aiofake/mrkts
edit_uri: edit/master/docs/

docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: slate
      primary: amber
      accent: amber
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Authentication: getting-started/authentication.md
      - Client lifecycle: getting-started/client.md
  - Guides:
      - Multi-account pool: guides/pool.md
      - Raw requests and standalone classes: guides/raw-and-standalone.md
      - Reusable workflows: guides/workflows.md
  - API reference:
      - Market:
          - Gifts: api/gifts.md
          - Orders: api/orders.md
          - Offers: api/offers.md
      - User: api/user.md
      - Steam and CS2: api/steam-cs2.md
  - FAQ: faq.md
